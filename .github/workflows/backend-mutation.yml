name: Backend mutation testing

# Mutation testing é caro (roda a suíte inteira uma vez por mutante) — fica
# fora do pipeline de push/PR de propósito, não bloqueia nada. Dispare manual
# quando quiser reavaliar app/services/, ou deixe a agenda semanal cobrir.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # toda segunda, 06:00 UTC (03:00 em Brasília)

jobs:
  mutate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinado na 2.5.1 (não a 3.x) pra bater com o que roda local no
          # Windows — 3.x provavelmente funciona liso aqui no Linux, mas
          # manter as duas pontas na mesma versão evita "funciona no CI, não
          # localmente" por causa só da versão da ferramenta.
          pip install "mutmut==2.5.1"

      - name: Roda o escopo configurado em setup.cfg (app/services/weekly_plan_service.py, user_service.py, workout_service.py)
        run: python -m mutmut run --CI

      - name: Resumo no job (sobreviventes = teste que precisa ser reforçado)
        if: always()
        run: |
          {
            echo "## Mutation testing — resultado"
            echo '```'
            python -m mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gera relatório HTML navegável
        if: always()
        run: python -m mutmut html

      - name: Upload do relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-html-report
          path: backend/html/
          retention-days: 30
