[mutmut]
paths_to_mutate=app/services/weekly_plan_service.py,app/services/user_service.py,app/services/workout_service.py
backup=False
# `python` puro (não um path absoluto de venv) de propósito: precisa resolver
# pro interpretador certo tanto em CI (actions/setup-python já bota na frente
# do PATH) quanto local (ative o venv antes: `venv\Scripts\activate` no
# Windows, `source venv/bin/activate` no Linux/Mac). Path absoluto de venv já
# quebrou local no Windows (cmd.exe interno do mutmut não resolve forward
# slash direito) — ver perfora-quality-testing-infra-2026-08 na memória.
runner=python -m pytest -x -q tests/test_error_handling.py tests/test_pagination.py tests/test_daily_bucket_integration.py tests/test_auth_security.py tests/test_report_route.py tests/test_auth_client_fixture.py tests/test_user_goals_service.py tests/test_weekly_plan_service.py tests/test_workout_crud.py tests/test_n_plus_one.py tests/test_service_lifecycle.py tests/test_service_rollback_guards.py
tests_dir=tests/
