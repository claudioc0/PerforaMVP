databases:
  - name: perfora-db
    plan: free
    databaseName: perfora
    user: perfora

services:
  - type: web
    name: perfora-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn run:app --workers 1 --threads 4 --timeout 120"
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: perfora-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.9"
